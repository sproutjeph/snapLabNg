app = "snaplab-ng"
primary_region = "iad"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "15s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"

[mounts]
  source = "snaplab_data"
  destination = "/data"

[env]
  MODE = "fixtures"
  TRUST_PROXY = "1"
  SPEND_LEDGER_PATH = "/data/ledger.json"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
